buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// ── Fix for unmaintained plugins missing the AGP namespace property ──
// AGP 8+ requires every Android module to declare a 'namespace'.
// Older plugins (e.g. flutter_windowmanager 0.2.0) only set it via
// the <manifest package="…"> attribute. This block auto-injects
// the namespace from the manifest for any subproject that lacks one.
// Uses plugins.withId instead of afterEvaluate to avoid timing issues
// with newer Gradle versions where projects are already evaluated.
subprojects { subproject ->
    plugins.withId("com.android.library") {
        def androidExt = subproject.extensions.findByName("android")
        if (androidExt != null) {
            try {
                if (androidExt.namespace == null || androidExt.namespace.isEmpty()) {
                    def manifest = file("${subproject.projectDir}/src/main/AndroidManifest.xml")
                    if (manifest.exists()) {
                        def parsed = new XmlSlurper().parse(manifest)
                        def pkg = parsed.@package.toString()
                        if (pkg != null && !pkg.isEmpty()) {
                            androidExt.namespace = pkg
                            println "Auto-injected namespace '${pkg}' into ${subproject.name}"
                        }
                    }
                }
            } catch (Exception e) {
                // Silently ignore — some subprojects may not have android blocks
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
