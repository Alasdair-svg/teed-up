name: teed_up
description: "Teed Up — Snap your golf booking. Your group is sorted."
publish_to: 'none'
version: 1.2.3+16

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # === Calendar (universal — iCloud, Google, Outlook, Exchange, CalDAV) ===
  device_calendar: ^4.3.2

  # === Contacts (device-native — all synced providers) ===
  flutter_contacts: ^1.1.9+2

  # === OCR (on-device, free, no cloud calls) ===
  google_mlkit_text_recognition: ^0.14.0

  # === Camera & Image ===
  image_picker: ^1.1.2

  # === OS Share-sheet integration (spec A6 — share screenshots from Photos/WhatsApp/Telegram) ===
  # Pinned to 1.8.1 (last CocoaPods-based release) — 1.9.0 requires Swift
  # Package Manager + Xcode 15+, which isn't available in this environment.
  receive_sharing_intent: 1.8.1

  # === Local Database ===
  sqflite: ^2.3.3+2
  path: ^1.9.0
  path_provider: ^2.1.4

  # === Background Tasks ===
  workmanager: 0.8.0

  # === Notifications ===
  flutter_local_notifications: ^18.0.1

  # === In-App Purchase ===
  in_app_purchase: ^3.2.0

  # === UI & Branding ===
  cupertino_icons: ^1.0.8

  # === State Management ===
  provider: ^6.1.2

  # === Utilities ===
  intl: ^0.19.0
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  collection: ^1.18.0
  shared_preferences: ^2.3.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Outfit
      fonts:
        - asset: fonts/Outfit-Regular.ttf
          weight: 400
        - asset: fonts/Outfit-Medium.ttf
          weight: 500
        - asset: fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: fonts/Outfit-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
          weight: 400
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600