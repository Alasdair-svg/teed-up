name: Verify Build (iOS + Android)

# Manual trigger only — does NOT auto-run on push.
# Codemagic handles real signing/submission; this is for build verification.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test'
        required: false
        default: 'redesign/all-teed-up-v2'

env:
  FLUTTER_VERSION: '3.44.1'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Flutter tests (fast — runs on Ubuntu)
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: flutter test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          git clone --depth 1 --branch ${{ env.FLUTTER_VERSION }} \
            https://github.com/flutter/flutter.git $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Confirm Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyse
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

  # ─────────────────────────────────────────────────────────────────────────────
  # Android debug build (no signing required)
  # ─────────────────────────────────────────────────────────────────────────────
  android:
    name: Android debug build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          git clone --depth 1 --branch ${{ env.FLUTTER_VERSION }} \
            https://github.com/flutter/flutter.git $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (debug, unsigned)
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # iOS simulator build (no signing required)
  # ─────────────────────────────────────────────────────────────────────────────
  ios:
    name: iOS simulator build
    runs-on: macos-15
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          git clone --depth 1 --branch ${{ env.FLUTTER_VERSION }} \
            https://github.com/flutter/flutter.git $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: flutter pub get

      - name: Precache iOS engine artifacts
        run: flutter precache --ios

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Build iOS (simulator, no codesign)
        run: flutter build ios --simulator --no-codesign
