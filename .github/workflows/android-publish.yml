name: Build & Publish Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build AAB & Upload to Play Store
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-caches-${{ hashFiles('android/**/*.gradle', 'android/**/*.gradle.kts') }}
          restore-keys: gradle-caches-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 --decode > android/app/teedup-release.jks

      - name: Configure signing
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=teedup-release.jks
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Build App Bundle
        run: |
          flutter build appbundle \
            --release \
            --obfuscate \
            --split-debug-info=build/debug-info

      - name: Upload to Google Play (internal track)
        run: |
          pip install --quiet google-auth google-auth-httplib2 google-api-python-client
          python3 - << 'PYEOF'
          import json, os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          PACKAGE_NAME = 'com.teedup.golf'
          AAB_PATH = 'build/app/outputs/bundle/release/app-release.aab'

          creds = Credentials(
              token=None,
              refresh_token=os.environ['PLAY_REFRESH_TOKEN'],
              token_uri='https://oauth2.googleapis.com/token',
              client_id=os.environ['PLAY_CLIENT_ID'],
              client_secret=os.environ['PLAY_CLIENT_SECRET'],
              scopes=['https://www.googleapis.com/auth/androidpublisher'],
          )

          service = build('androidpublisher', 'v3', credentials=creds)
          print('Authenticated with Google Play API')

          edit = service.edits().insert(packageName=PACKAGE_NAME, body={}).execute()
          edit_id = edit['id']
          print(f'Edit: {edit_id}')

          media = MediaFileUpload(
              AAB_PATH,
              mimetype='application/octet-stream',
              resumable=True,
              chunksize=10 * 1024 * 1024,
          )
          print('Uploading AAB...')
          bundle = service.edits().bundles().upload(
              packageName=PACKAGE_NAME,
              editId=edit_id,
              media_body=media,
          ).execute()
          version_code = bundle['versionCode']
          print(f'Uploaded version code: {version_code}')

          service.edits().tracks().update(
              packageName=PACKAGE_NAME,
              editId=edit_id,
              track='internal',
              body={'releases': [{'versionCodes': [str(version_code)], 'status': 'completed'}]},
          ).execute()
          print('Assigned to internal track')

          service.edits().commit(packageName=PACKAGE_NAME, editId=edit_id).execute()
          print(f'SUCCESS: All Teed Up v{version_code} live on Google Play internal testing!')
          PYEOF
        env:
          PLAY_CLIENT_ID: ${{ secrets.PLAY_CLIENT_ID }}
          PLAY_CLIENT_SECRET: ${{ secrets.PLAY_CLIENT_SECRET }}
          PLAY_REFRESH_TOKEN: ${{ secrets.PLAY_REFRESH_TOKEN }}
