workflows:
  # ============================================================
  # ANDROID BUILD — Release APK + AAB
  # ============================================================
  android-release:
    name: Android Release
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
      groups:
        - google_play_credentials  # Add in Codemagic UI
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $FLUTTER_ROOT/.pub-cache
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Run tests
        script: flutter test
      - name: Build Android APK
        script: flutter build apk --release
      - name: Build Android App Bundle
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal  # Change to 'production' for final release
        submit_as_draft: true

  # ============================================================
  # iOS BUILD — IPA for App Store / TestFlight
  # ============================================================
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials  # Add in Codemagic UI
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $FLUTTER_ROOT/.pub-cache
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Run tests
        script: flutter test
      - name: Set up code signing
        script: |
          # Codemagic handles signing automatically
          # Just set up the provisioning profile and certificate
          # in the Codemagic UI under Code signing identities
          xcode-project use-profiles
      - name: Build iOS IPA
        script: |
          flutter build ipa \
            --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers

  # ============================================================
  # BOTH PLATFORMS — Build Android + iOS together
  # ============================================================
  release-all:
    name: Release All Platforms
    max_build_duration: 60
    instance_type: mac_mini_m2  # macOS needed for iOS
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      java: 17
      groups:
        - app_store_credentials
        - google_play_credentials
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/Library/Caches/CocoaPods
        - $FLUTTER_ROOT/.pub-cache
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Install CocoaPods
        script: cd ios && pod install
      - name: Run tests
        script: flutter test
      - name: Build Android
        script: |
          flutter build apk --release
          flutter build appbundle --release
      - name: Set up iOS code signing
        script: xcode-project use-profiles
      - name: Build iOS
        script: |
          flutter build ipa \
            --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab
      - build/ios/ipa/*.ipa
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
