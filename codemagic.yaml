workflows:
  # ============================================================
  # ANDROID BUILD — Release APK + AAB
  # ============================================================
  android-release:
    name: Android Release
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
      # groups:
      #   - google_play_credentials  # Uncomment after adding in Codemagic UI
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $FLUTTER_ROOT/.pub-cache
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Run tests
        script: flutter test
      - name: Build Android APK
        script: |
          flutter build apk \
            --release \
            --obfuscate \
            --split-debug-info=build/debug-info
      - name: Build Android App Bundle
        script: |
          flutter build appbundle \
            --release \
            --obfuscate \
            --split-debug-info=build/debug-info
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab
      # Debug symbols — upload to Play Console for deobfuscated crash reports
      - build/debug-info/**
    # publishing:
    #   google_play:
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal
    #     submit_as_draft: true

  # ============================================================
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: TAG App Store Connect
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: "com.teedup.golf"
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $FLUTTER_ROOT/.pub-cache
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Run tests
        script: flutter test
      - name: Initialize keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          export CERTIFICATE_PRIVATE_KEY=$(echo $CERTIFICATE_PRIVATE_KEY_B64 | base64 --decode)
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build iOS IPA
        script: |
          flutter build ipa \
            --release \
            --obfuscate \
            --split-debug-info=build/ios-debug-info \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios-debug-info/**
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers

  # ============================================================
  # iOS COMPILE CHECK — No signing, proves iOS builds in cloud
  # ============================================================
  ios-compile-check:
    name: iOS Compile Check
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $FLUTTER_ROOT/.pub-cache
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Run tests
        script: flutter test
      - name: Build iOS (no codesign)
        script: |
          flutter build ios \
            --release \
            --no-codesign \
            --obfuscate \
            --split-debug-info=build/debug-info
    artifacts:
      - build/ios/iphoneos/*.app

